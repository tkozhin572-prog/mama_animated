<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Моя мама 💖✨</title><style>body{margin:0;padding:0;font-family:Arial,sans-serif;background:#fff0f5;color:#d81b60;overflow:hidden;}h1{font-size:3em;text-align:center;color:#ff4081;margin-top:20px;}p{text-align:center;font-size:1.5em;line-height:1.5em;margin:15px;}img{display:block;margin:20px auto;border-radius:20px;max-width:400px;}span.heart{color:#e91e63;font-size:2em;display:inline-block;animation:beat 1s infinite;}@keyframes beat{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}.floating{position:absolute;font-size:2em;animation:float 10s linear infinite;}@keyframes float{0%{transform:translateY(100vh) rotate(0deg);}50%{transform:translateY(50vh) rotate(180deg);}100%{transform:translateY(-10vh) rotate(360deg);}}</style></head><body><h1>Моя мама 💖✨</h1><p>Моя мама самая удивительная, добрая и заботливая на свете <span class="heart">❤️</span><span class="heart">💖</span><span class="heart">💕</span></p><img src="mama.jpg" alt="Моя мама"><p>Она всегда поддерживает меня, учит новому и вдохновляет быть лучше каждый день <span class="heart">💗</span></p><p>Каждое её слово — поддержка, каждый её жест — любовь, а каждое объятие — счастье <span class="heart">💖</span></p><h1>Ты моя супергероиня! 💕✨</h1><footer><p style="text-align:center;">&copy; 2025 Моя мама 💖💖</p></footer><script>for(let i=0;i<40;i++){let h=document.createElement('div');h.className='floating';h.style.left=Math.random()*100+'vw';h.style.fontSize=15+Math.random()*25+'px';h.style.animationDuration=5+Math.random()*10+'s';h.innerText='❤️';document.body.appendChild(h);}</script></body></html>
